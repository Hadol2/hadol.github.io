name: "Build and Deploy"
on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Test publisher
        run: |
          npm ci --prefix scripts
          npm test --prefix scripts

      - name: Build site
        run: bundle exec jekyll b -d "_site" --baseurl ""
        env:
          JEKYLL_ENV: "production"

      - name: Verify site artifact
        run: |
          test -f "_site/search.json"
          test ! -e "_site/scripts/publish.js"
          test ! -e "_site/mockup.html"
          test "$(grep -c '<meta name="description"' _site/index.html)" -eq 1
          ! grep -R -q "prod-files-secure" "_site"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
